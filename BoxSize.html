<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- content-box sizing excludes the padding,borders and are applied separately -->
     <!-- border-box sizing includes the padding,borders within the elements dimensions -->
      <!-- relative change in position relative/with respect to the original/normal position -->
       <!-- absolute - change in position relative/with respect to its nearest ancestor -->
    <div style="background-color: red;
    height: 100px;
    width: 100px;
    position: relative;
    ">
    <div style="background-color: aquamarine;
    height:100px;
    width:100px;
    position: absolute;
    bottom: 0;
    right: 0;
    "></div>
    </div>
</body>

</html>
