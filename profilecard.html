
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Card</title>

    <style>
        #profile-container {
            height: 300px;
            width: 300px;
            border: 2px solid black;
            margin: 20px auto;
            background-color: grey;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #profile-container img {
            height: 80px;
            width: 80px;
            border-radius: 50%;
        }

        #profile-container h4 {
            margin: 15px 0 5px;
        }

        #profile-container p {
            font-size: small;
        }

        #profile-container button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="profile-container">

        <img src="https://tse1.mm.bing.net/th/id/OIP._HGzWYOh2l2AOjIE_rrPqAHaNK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Profile Picture">

        <h4>Anshika Singh</h4>

        <p>Computer Science Student</p>

        <button>Connect</button>

    </div>

</body>

</html>
