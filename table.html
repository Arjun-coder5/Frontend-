<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <!--table is the collection of rows and columns-->
    <table border="">
        <!--table head-->
        <thead>
            <tr>
                <th colspan="2">Product</th>
                <th rowspan="2">Qty</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="2">apple</td>
                <td rowspan="2">2</td> </tr>
            <tr>  <td colspan="2">mango</td>  </tr>
            <tr> <td colspan="2" >Orange</td>
                <td>4</td> </tr>
            <tr>   <td colspan="2">grapes</td>
                <td> 4</td>
                
            </tr>
            <tr>
                <td colspan="2">total</td>
                <td>14</td>
            </tr>
        </tbody>
        <!--table footer-->
        <tfoot></tfoot>
    </table>
</body>
</html>
