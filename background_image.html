<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .new-img{
            background-image: url("https://tse4.mm.bing.net/th/id/OIP.ahdSFiWGhdq-F-SDXqvP-QHaFj?r=0&rs=1&pid=ImgDetMain&o=7&rm=3");
            height:300px;
            width:300px;
            /* defines the image portion to show  */
            background-position: bottom;
            /* contain - shows the whole img */
            /* cover- fills the element's dimensions completely */
            background-size:contain;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <!-- img is a html native tag which shows the img as th actual content of the page  -->
    <img height="100px" src="https://tse2.mm.bing.net/th/id/OIP.lFPGmh3TqTLg-pxFtjW-KgHaLH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="">
    <!-- the image is part visual design of the html element.It provies flexibilty to the image modification -->
     <div class="new-img"></div>
</body>
</html>
