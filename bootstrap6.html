<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Carousel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body>

  <div id="carouselExampleAutoplaying"
       class="carousel slide"
       data-bs-ride="carousel"
       data-bs-interval="2000">

    <div class="carousel-inner">

      <div class="carousel-item active">
        <img src="https://i.pinimg.com/736x/39/9b/b5/399bb52ca52386d5cbcb0647761983f0.jpg"
          class="d-block w-100" alt="KitKat">
      </div>

      <div class="carousel-item">
        <img src="https://i.pinimg.com/736x/98/2d/d7/982dd794497d1cfce9024a396ca4c8a5.jpg"
          class="d-block w-100" alt="Chocolate">
      </div>

      <div class="carousel-item">
        <img src="https://i.pinimg.com/736x/e8/97/ec/e897ec77c9a494b00243051e8b5edfde.jpg"
          class="d-block w-100" alt="Chocolate">
      </div>

    </div>

    <button class="carousel-control-prev"
      type="button"
      data-bs-target="#carouselExampleAutoplaying"
      data-bs-slide="prev">

      <span class="carousel-control-prev-icon"></span>
      <span class="visually-hidden">Previous</span>

    </button>

    <button class="carousel-control-next"
      type="button"
      data-bs-target="#carouselExampleAutoplaying"
      data-bs-slide="next">

      <span class="carousel-control-next-icon"></span>
      <span class="visually-hidden">Next</span>

    </button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
